name: Release

# Builds the jar and publishes it as a GitHub Release asset, so a fresh machine
# can download dstokencheck.jar + run.bat and just double-click.
#
# Trigger: push a version tag, e.g.
#     git tag v1.0.0 && git push origin v1.0.0

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build (jar targets Java 8)
        run: mvn -B -DskipTests clean package

      - name: Show what we built
        run: ls -l target/dstokencheck.jar

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/dstokencheck.jar
            run.bat
          generate_release_notes: true
          fail_on_unmatched_files: true
